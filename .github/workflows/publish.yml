# Publishes to npm on a v* tag, authenticating with OIDC instead of a token: npmjs.com is
# configured to trust this repository and this workflow filename, so no secret exists to leak or
# rotate. Renaming this file breaks publishing until the trusted publisher is updated to match.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # required: lets the runner mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # A tag that disagrees with package.json would publish the wrong version, or fail late and
      # leave the tag behind. Check it before anything is built.
      - name: Tag matches package.json version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          test "$tagged" = "$declared" || {
            echo "tag $GITHUB_REF_NAME does not match package.json $declared" >&2
            exit 1
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Provenance is attached automatically for a public package from a public repository.
      - run: npm publish
